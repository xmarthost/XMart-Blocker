name: Release APK

# GitHub → Actions → "Release APK" → Run workflow → type a version (e.g. 1.0.1).
# Builds a signed APK, tags v<version> and publishes a GitHub Release. TVs running
# XMart Blocker see the new version the next time the app is opened (or within 12 hours).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 1.0.1 (must be higher than the last release)"
        required: true
      notes:
        description: "What changed (shown on the TV)"
        required: false
        default: "Improvements to Shorts detection."

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: Check version format
        run: |
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3"; exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$VERSION_NAME" | grep -q .; then
            echo "::error::v$VERSION_NAME already exists"; exit 1
          fi

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets first (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "XMart-Blocker-v$VERSION_NAME.apk"
          # Fixed name so this link always gives the newest APK:
          # https://github.com/<owner>/<repo>/releases/latest/download/XMart-Blocker.apk
          cp app/build/outputs/apk/release/app-release.apk "XMart-Blocker.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v$VERSION_NAME" "XMart-Blocker-v$VERSION_NAME.apk" "XMart-Blocker.apk" \
            --target "$GITHUB_SHA" --title "XMart Blocker v$VERSION_NAME" --notes "$NOTES"
