plugins {
    id 'com.android.application'
}

// Version comes from the release workflow (VERSION_NAME=1.2.3); local builds use 1.0.0.
def verName = System.getenv('VERSION_NAME') ?: '1.0.0'
def parts = verName.tokenize('.').collect { it.replaceAll('[^0-9]', '') ?: '0' }.collect { it as int }
while (parts.size() < 3) parts << 0
def verCode = parts[0] * 10000 + parts[1] * 100 + parts[2]

// GitHub repo that hosts releases (owner/name). CI passes GITHUB_REPOSITORY automatically.
def updateRepo = System.getenv('GITHUB_REPOSITORY') ?: project.property('xmart.updateRepo')

android {
    namespace 'com.xmarthost.blocker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xmarthost.blocker'
        minSdk 30
        targetSdk 35
        versionCode verCode
        versionName verName
        buildConfigField 'String', 'UPDATE_REPO', "\"${updateRepo}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // A private key from CI secrets if provided; otherwise the public TESTING key
            // committed in signing/ (password "xmart-test"). Do not ship to the public with it.
            def ks = System.getenv('SIGNING_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            } else {
                storeFile rootProject.file('signing/test-release.jks')
                storePassword 'xmart-test'
                keyAlias 'xmart-test'
                keyPassword 'xmart-test'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Optional Maven mirror for Robolectric's Android jars (set when Maven Central is rate-limited).
                def repo = System.getenv('ROBOLECTRIC_REPO')
                if (repo) systemProperty 'robolectric.dependency.repo.url', repo
                maxHeapSize = '2g'
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
